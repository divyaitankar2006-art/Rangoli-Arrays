<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fff7b2"/>
      <stop offset="60%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d62828"/>
      <stop offset="35%" stop-color="#f77f00"/>
      <stop offset="70%" stop-color="#fcbf49"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="clay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="30%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#b23a00"/>
    </linearGradient>
  </defs>

  <!-- Background decorative rangoli petals -->
  <circle cx="32" cy="32" r="30" fill="#2d0b38"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#e0a96d" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Rangoli outer dots -->
  <circle cx="32" cy="6" r="2" fill="#ffd166"/>
  <circle cx="50" cy="14" r="2" fill="#ffd166"/>
  <circle cx="58" cy="32" r="2" fill="#ffd166"/>
  <circle cx="50" cy="50" r="2" fill="#ffd166"/>
  <circle cx="32" cy="58" r="2" fill="#ffd166"/>
  <circle cx="14" cy="50" r="2" fill="#ffd166"/>
  <circle cx="6" cy="32" r="2" fill="#ffd166"/>
  <circle cx="14" cy="14" r="2" fill="#ffd166"/>

  <!-- Flame glow -->
  <circle cx="32" cy="22" r="14" fill="url(#glow)"/>

  <!-- Diya Base (Traditional Clay Lamp) -->
  <path d="M12 36 Q18 48 32 49 Q46 48 52 36 Q32 40 12 36 Z" fill="url(#clay)"/>
  <ellipse cx="32" cy="36" rx="20" ry="4" fill="#8c2500"/>
  <ellipse cx="32" cy="36" rx="17" ry="2.5" fill="#f77f00"/>

  <!-- Flame -->
  <path d="M32 10 C35 17 38 22 38 27 C38 31 35 34 32 34 C29 34 26 31 26 27 C26 22 29 17 32 10 Z" fill="url(#flame)"/>
  <path d="M32 15 C33.5 19 35 23 35 26 C35 28.5 33.5 30 32 30 C30.5 30 29 28.5 29 26 C29 23 30.5 19 32 15 Z" fill="#ffffff"/>
</svg>
